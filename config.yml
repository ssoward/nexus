# Nexus configuration - non-secret values only
# Secrets (APP_SECRET, JWT_SECRET, CRYPTO_SALT) must be set as environment variables

app:
  max_panes: 6
  log_level: INFO
  db_path: ~/.nexus/nexus.db

session:
  jwt_expire_minutes: 43200   # 30 days — slid forward on every refresh while the app is in use
  absolute_max_hours: 720     # Force a fresh login 30 days after the ORIGINAL login regardless of refreshes —
                              # a hard ceiling on how long a stolen cookie is usable. 0 disables the ceiling.
  # Environment variable NAMES forwarded from the backend into every terminal
  # session, on top of the built-in allowlist (PATH, HOME, SHELL, LANG, LC_*,
  # XDG_*, SSH_AUTH_SOCK, TMPDIR, TZ). Nothing else from .env reaches a session.
  # The values come from .env on each machine; any process a session starts can
  # read them, so list only what CLIs in your sessions actually need.
  pass_env:
    - ANTHROPIC_API_KEY
    - DEEPSEEK_API_KEY

recovery:
  enabled: true    # serialize session ring buffers on graceful shutdown and replay after restart
  ttl_hours: 24    # discard the recovery file if the backend was down longer than this

presets:
  - name: bash
    command: ["/bin/bash", "-l"]
    description: Login shell

  - name: zsh
    command: ["/bin/zsh", "-l"]
    description: Zsh login shell

  - name: claude
    command: ["claude"]
    description: Claude Code CLI

  - name: python
    command: ["python3"]
    description: Python 3 REPL

# WebAuthn relying-party identity. The hostname is machine-specific and this
# file is shared via git, so set RP_ID / WEBAUTHN_ORIGIN (and NEXUS_HOST for
# Caddy) in each machine's .env instead of here — see .env.example. Values here
# are only a fallback; the defaults below deliberately point at localhost so a
# missing .env entry fails obviously (passkeys refuse to enrol) rather than
# silently serving another machine's identity.
webauthn:
  rp_id: localhost
  rp_name: Nexus
  origin: http://localhost:8000
